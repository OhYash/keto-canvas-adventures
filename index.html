<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OhYa.sh – Senior Backend Engineer</title>
    <meta name="author" content="Yash Yadav" />
  </head>

  <body>
    <div id="root">
      <header style="padding: 2rem; max-width: 800px; margin: 0 auto; color: #f8fafc; font-family: system-ui, sans-serif;">
        <h1 style="font-size: 1.875rem; font-weight: 700; color: #ffffff; margin-bottom: 0.5rem;">
          I'm Yash. Engineer today, founder in progress.
        </h1>
        <p style="color: #94a3b8; font-size: 1rem; line-height: 1.5;">
          Interactive portfolio of Yash Yadav — Senior Backend Engineer &amp; Founder in progress. Systems architecture, distributed backend services, personal projects, and adventures.
        </p>
      </header>
    </div>
    <script>
      // GitHub Pages SPA redirect handler
      (function() {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect != location.href) {
          history.replaceState(null, null, redirect);
        }
      })();

      // Check for redirect parameter
      (function() {
        var query = window.location.search.substring(1);
        var parts = query.split('&');
        var redirect = null;

        for (var i = 0; i < parts.length; i++) {
          var param = parts[i].split('=');
          if (param[0] === 'p') {
            redirect = decodeURIComponent(param[1].replace(/~and~/g, '&'));
            break;
          }
        }

        if (redirect) {
          sessionStorage.redirect = redirect;
          history.replaceState(null, null, redirect);
        }
      })();

      // Only load Umami in production
      if (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
        const script = document.createElement('script');
        script.defer = true;
        script.src = 'https://cloud.umami.is/script.js';
        script.setAttribute('data-website-id', '3c5dc21e-5b59-4e65-88f9-f9c78b402a8d');
        document.head.appendChild(script);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
