    <rect x="480" y="12" width="120" height="22" rx="4" fill="#1e293b"/>
    <text x="490" y="27" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">HDFC Salary</text>
    
    <text x="640" y="27" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">↔ Transfer</text>
    <text x="860" y="27" text-anchor="end" fill="#f87171" font-family="monospace" font-size="13" font-weight="700">-₹1,00,000.00</text>
    <text x="1000" y="27" text-anchor="end" fill="#94a3b8" font-family="monospace" font-size="12">₹7,45,210.00 ⚓</text>
    
    <text x="1080" y="27" fill="#64748b" font-family="sans-serif" font-size="13">✏️ 🗑️</text>
    <line x1="0" y1="52" x2="1120" y2="52" stroke="#1e293b" stroke-width="1"/>
