<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" fill="none">
  <!-- Background -->
  <rect width="1200" height="675" rx="16" fill="#090d16" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Window Controls -->
  <circle cx="32" cy="32" r="6" fill="#ef4444"/>
  <circle cx="52" cy="32" r="6" fill="#f59e0b"/>
  <circle cx="72" cy="32" r="6" fill="#10b981"/>
  <text x="110" y="37" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">INR Finance Compass — High-Density Passbook &amp; Ledger Audit (UI Preview)</text>
  <line x1="0" y1="60" x2="1200" y2="60" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Subheader / Filter Bar -->
  <rect x="40" y="80" width="340" height="36" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="56" y="103" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">🔍 Search transactions, remarks, payees...</text>

  <!-- Filter Pills -->
  <rect x="400" y="80" width="110" height="36" rx="8" fill="#1e293b"/>
  <text x="416" y="103" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">All Accounts</text>

  <rect x="520" y="80" width="100" height="36" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="536" y="103" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">September 2026</text>

  <!-- Add Transaction Button -->
