  <text x="1025" y="103" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">+ Add Transaction</text>

  <!-- Table Container -->
  <rect x="40" y="135" width="1120" height="500" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Table Header -->
