  <text x="64" y="161" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">DATE</text>
  <text x="160" y="161" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">DESCRIPTION / REMARKS</text>
  <text x="520" y="161" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">ACCOUNT</text>
  <text x="680" y="161" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">CATEGORY</text>
  <text x="840" y="161" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">AMOUNT</text>
  <text x="970" y="161" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">BALANCE ANCHOR</text>
  <text x="1110" y="161" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">ACTIONS</text>
  <line x1="40" y1="177" x2="1160" y2="177" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Row 1: Salary Credit -->
  <g transform="translate(40, 185)">
    <text x="24" y="24" fill="#94a3b8" font-family="monospace" font-size="12">01 Sep 2026</text>
    <text x="120" y="22" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">ACH CREDIT: TESTGORILLA B.V.</text>
    <text x="120" y="40" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Monthly consulting compensation</text>
    
    <rect x="480" y="12" width="120" height="22" rx="4" fill="#1e293b"/>
    <text x="490" y="27" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">HDFC Salary</text>
    
    <text x="640" y="27" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Income / Salary</text>
    <text x="860" y="27" text-anchor="end" fill="#34d399" font-family="monospace" font-size="13" font-weight="700">+₹4,50,000.00</text>
    <text x="1000" y="27" text-anchor="end" fill="#94a3b8" font-family="monospace" font-size="12">₹8,45,210.00 ⚓</text>
    
