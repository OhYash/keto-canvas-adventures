    <text x="490" y="27" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">ICICI Amazon Pay</text>
    
    <text x="640" y="27" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Motorcycle / Gear</text>
    <text x="860" y="27" text-anchor="end" fill="#f87171" font-family="monospace" font-size="13" font-weight="700">-₹3,250.00</text>
    <text x="1000" y="27" text-anchor="end" fill="#fca5a5" font-family="monospace" font-size="12">-₹42,850.00 ⚓</text>
    
    <text x="1080" y="27" fill="#64748b" font-family="sans-serif" font-size="13">✏️ 🗑️</text>
    <line x1="0" y1="52" x2="1120" y2="52" stroke="#1e293b" stroke-width="1"/>
