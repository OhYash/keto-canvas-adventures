  <!-- Row 4: Credit Card Swipe (Amazon Pay) -->
  <g transform="translate(40, 365)">
    <text x="24" y="24" fill="#94a3b8" font-family="monospace" font-size="12">29 Aug 2026</text>
    <text x="120" y="22" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">AMZN Mktp IN*Triumph Spares</text>
    <text x="120" y="40" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Ataco motorcycle oil filter &amp; chain lube</text>
    
