  <!-- Footer Banner: Balance Gap Detection Integrity -->
  <g transform="translate(60, 560)">
    <rect width="1080" height="56" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <text x="24" y="33" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">✓ Strict Ledger Audit Active:</text>
    <text x="210" y="33" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">All running account balances strictly match bank statement anchors. No balance gap discrepancies detected.</text>
